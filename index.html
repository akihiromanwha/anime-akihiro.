<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="AkihiroDaikyAnime">
<meta name="theme-color" content="#0a0a0a">
<title>AkihiroDaikyAnime</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="akhanime.png">
<link rel="stylesheet" href="style.css">
<!-- Cargamos el reproductor de forma diferida para no bloquear la carga inicial -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest" defer></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js" defer></script>
</head>
<body>

<header>
  <div class="logo">Akihiro<span>DaikyAnime</span></div>
  <div class="searchWrap">
    <input id="searchInput" type="search" placeholder="Buscar anime...">
  </div>
  <button id="profileBtn" class="smallBtn">👤</button>
  <button id="themeBtn" class="smallBtn">☀️</button>
</header>

<main>
  <!-- Hero estático y ligero -->
  <section class="hero">
    <div class="heroContent">
      <p class="tag">ANIME • MANGA • MANHWA</p>
      <h1>Tu mundo de anime</h1>
      <p>Busca tus series favoritas y consulta sus capítulos.</p>
    </div>
  </section>

  <section class="typeToggle">
    <button class="typeBtn active" data-type="series">📺 Series</button>
    <button class="typeBtn" data-type="movies">🎬 Películas</button>
  </section>

  <section class="toolbar">
    <h2 id="sectionTitle">Animes populares</h2>
    <select id="sortFilter">
      <option value="default">Ordenar...</option>
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
    </select>
  </section>

  <section id="status" class="status">Cargando catálogo...</section>
  <section id="animeGrid" class="grid"></section>
</main>

<footer class="siteFooter">
  <p class="copyright">© 2026 <b>AkihiroDaikyAnime</b> — Todos los derechos reservados</p>
</footer>

<div id="modal" class="modal hidden">
  <div class="modalBox">
    <button id="closeModal" class="close">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
