<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimeAkihiroDaiky</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Anime<span>AkihiroDaiky</span></div>
  <input id="searchInput" type="search" placeholder="Buscar anime...">
  <button id="profileBtn" class="iconBtn">👤</button>
  <button id="themeBtn" class="iconBtn">☀️</button>
</header>

<section class="hero">
  <div class="heroBg" id="heroBgA"></div>
  <div class="heroBg" id="heroBgB"></div>
  <div class="heroContent">
    <p class="tag">ANIME • MANGA • MANHWA</p>
    <h1>Tu mundo de anime</h1>
    <p>Busca tus series favoritas.</p>
  </div>
</section>

<section class="directory">
  <div class="directoryHead">
    <h2>📂 Directorio</h2>
    <button id="toggleFilters" class="btnFilter">🔍 Filtrar</button>
  </div>

  <div class="filterPanel" id="filterPanel">
    <div class="filterRow">
      <label>Género</label>
      <select id="genreFilter">
        <option value="">Todos</option>
      </select>
    </div>

    <div class="filterRow">
      <label>Año</label>
      <select id="yearFilter">
        <option value="">Todos</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
        <option value="2017">2017</option>
        <option value="2016">2016</option>
        <option value="2015">2015</option>
      </select>
    </div>

    <div class="filterRow">
      <label>Estación</label>
      <select id="seasonFilter">
        <option value="">Todas</option>
        <option value="WINTER">❄️ Invierno</option>
        <option value="SPRING">🌸 Primavera</option>
        <option value="SUMMER">☀️ Verano</option>
        <option value="FALL">🍂 Otoño</option>
      </select>
    </div>

    <div class="filterRow">
      <label>Día</label>
      <select id="dayFilter">
        <option value="">Todos</option>
        <option value="1">Lunes</option>
        <option value="2">Martes</option>
        <option value="3">Miércoles</option>
        <option value="4">Jueves</option>
        <option value="5">Viernes</option>
        <option value="6">Sábado</option>
        <option value="0">Domingo</option>
      </select>
    </div>

    <button id="clearFilters" class="btnClear">✕ Limpiar filtros</button>
  </div>
</section>

<section class="toolbar">
  <h2 id="sectionTitle">Animes populares</h2>
  <span id="resultsCount" class="resultsCount"></span>
</section>

<section id="status" class="status">Cargando catálogo...</section>
<section id="animeGrid" class="grid"></section>

<footer>
  <p>© 2026 <b>AnimeAkihiroDaiky</b></p>
</footer>

<div id="modal" class="modal hidden">
  <div class="modalBox">
    <button id="closeModal" class="close">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
