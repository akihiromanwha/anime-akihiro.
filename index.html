<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="AnimeAkihiroDaiky">
<meta name="description" content="AnimeAkihiroDaiky — Tu mundo de anime, manga y manhwa.">
<meta name="theme-color" content="#080808">
<title>AnimeAkihiroDaiky</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Anime<span>AkihiroDaiky</span></div>
  <div class="searchWrap">
    <input id="searchInput" type="search" placeholder="Buscar anime...">
  </div>
  <button id="themeBtn" class="smallBtn">☀️</button>
</header>

<main>

  <section class="hero">
    <div class="heroBg" id="heroBgA"></div>
    <div class="heroBg" id="heroBgB"></div>
    <div class="heroContent">
      <p class="tag">ANIME • MANGA • MANHWA</p>
      <h1>Tu mundo de anime,<br>manga y manhwa.</h1>
      <p class="heroSub">Busca tus series favoritas y consulta sus capítulos.</p>
      <button id="heroListBtn" class="primary">❤️ Mi lista</button>
    </div>
  </section>

  <section class="toolbar">
    <h2 id="sectionTitle">Animes populares</h2>
    <select id="genreFilter">
      <option value="">Todos los géneros</option>
    </select>
  </section>

  <section id="status" class="status">Cargando catálogo...</section>
  <section id="animeGrid" class="grid"></section>
</main>

<footer class="siteFooter">
  <p>© 2026 <b>AnimeAkihiroDaiky</b> — Hecho por 
    <a href="https://github.com/akihiromanwha" target="_blank" rel="noopener">akihiromanwha</a>
  </p>
  <p class="muted">Los videos y portadas pertenecen a sus respectivos autores.</p>
</footer>

<div id="modal" class="modal hidden">
  <div class="modalBox">
    <button id="closeModal" class="close">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
      (e.ctrlKey && e.key.toLowerCase() === 'u')){
    e.preventDefault();
  }
});

window._firma = "ANIMEAKHIRODAIKY-2026-BY-AKIHIROMANWHA";
